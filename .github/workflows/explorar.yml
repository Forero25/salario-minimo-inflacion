name: explorar-fuentes
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/explorar.yml'] } }
permissions: { contents: write }
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Wayback CDX de anexos de subclases
        run: |
          set +e
          for pre in "dane.gov.co/files/investigaciones/boletines/ipc/" "dane.gov.co/files/operaciones/IPC/" "dane.gov.co/files/investigaciones/ipc/"; do
            curl -s --max-time 120 "https://web.archive.org/cdx/search/cdx?url=${pre}&matchType=prefix&fl=original&collapse=urlkey&limit=20000" | grep -iE "subclase" | sort -u | head -100
          done
      - name: BIS precios al consumidor
        run: |
          set +e
          for c in CO CL PE MX BR; do echo "$c $(curl -s -o b.csv -w '%{http_code} %{size_download}' --max-time 60 "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_LONG_CPI/1.0/M.${c}.771?format=csv")"; head -2 b.csv; tail -1 b.csv; done
      - name: Repositorio BanRep (DSpace)
        run: |
          set +e
          curl -s --max-time 60 "https://repositorio.banrep.gov.co/server/api/discover/search/objects?query=minutas%20junta%20directiva&size=20" -H "Accept: application/json" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); o=d['_embedded']['searchResult']
          print('total',o['page']['totalElements'])
          for x in o['_embedded']['objects']: i=x['_embedded']['indexableObject']; print(i.get('name'), i.get('handle'))" || echo fallo
          curl -s --max-time 60 "https://repositorio.banrep.gov.co/server/api/discover/search/objects?query=comunicado%20tasa%20de%20interes&size=10" -H "Accept: application/json" | head -c 600
