name: explorar-fuentes
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/explorar.yml'] } }
permissions: { contents: write }
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Patrones de URL de anexos históricos
        run: |
          set +e
          D=https://www.dane.gov.co/files
          for y in 19 20 21 22 23 24 25; do for m in dic; do
            for p in "operaciones/IPC/${m}20${y}/anex-IPC-subclases-ingresos-total-${m}20${y}.xlsx" "investigaciones/boletines/ipc/anex-IPC-subclases-${m}20${y}.xlsx" "investigaciones/boletines/ipc/anex-IPC-subclases-ingresos-total-${m}20${y}.xlsx" "operaciones/IPC/${m}20${y}/anex-IPC-subclases-${m}20${y}.xlsx"; do
              echo "$p $(curl -s -o /dev/null -w '%{http_code} %{size_download} %{content_type}' -A Mozilla/5.0 $D/$p)"
            done; done; done
      - name: Página histórica, enlaces de subclases
        run: |
          curl -sL -A Mozilla/5.0 "https://www.dane.gov.co/index.php/estadisticas-por-tema/precios-y-costos/indice-de-precios-al-consumidor-ipc/ipc-historico" | grep -oiE 'href="[^"]+"' | grep -iE "subclase|ingresos|clases|grupos|Indices|Ponderac" | sort -u | head -120
      - name: Banco de la República (archivos y repositorio)
        run: |
          set +e
          for u in https://www.banrep.gov.co/sites/default/files/paginas/minutas.pdf https://repositorio.banrep.gov.co/ https://repositorio.banrep.gov.co/server/api/core/sites https://www.banrep.gov.co/es/node/1 https://totoro.banrep.gov.co/estadisticas-economicas/ https://suameca.banrep.gov.co/ ; do
            echo "$u $(curl -s -o r.html -w '%{http_code} %{size_download} %{content_type}' -A Mozilla/5.0 --max-time 40 $u) $(grep -c shieldsquare r.html)"
          done
      - name: FRED sin llave
        run: |
          for s in COLCPIALLMINMEI CHLCPIALLMINMEI PERCPIALLMINMEI MEXCPIALLMINMEI BRACPIALLMINMEI; do echo "$s $(curl -s -o f.csv -w '%{http_code} %{size_download}' "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s") $(tail -1 f.csv)"; done
